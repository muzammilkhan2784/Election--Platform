global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: app
    static_configs:
      - targets: ["app:3000"]

  - job_name: relay
    static_configs:
      - targets: ["relay:9101"]

  - job_name: results-consumer
    static_configs:
      - targets: ["results-consumer:9102"]
