services:
  postgres:
    image: postgres:16-alpine
    container_name: election_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - election_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Single-node Kafka in KRaft mode — no ZooKeeper, which Kafka removed the
  # need for in 3.x. One broker is right for local development; the topic is
  # partitioned so consumers can scale horizontally later.
  kafka:
    image: apache/kafka:3.9.0
    container_name: election_kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # A single broker cannot replicate, so the internal topics must not ask for more.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - election_kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  app:
    build: .
    container_name: election_app
    restart: unless-stopped
    environment:
      # Inside the compose network the database is reached by service name on
      # its internal port. The 5433 mapping above only applies to the host.
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      FLASK_ENV: ${FLASK_ENV}
      # Gunicorn runs several workers; prometheus_client aggregates their
      # counters through this shared directory.
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    ports:
      - "3000:3000"
    volumes:
      # Read-only so the importer can read the dataset without it being baked
      # into the image.
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Moves committed events from the event_outbox table to Kafka. Separate from
  # the web app so a broker outage delays delivery instead of rejecting votes.
  relay:
    build: .
    container_name: election_relay
    restart: unless-stopped
    command: ["python", "-m", "workers.outbox_relay"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # Collapses vote events into at most one materialized-view refresh per
  # interval, keeping the ~700ms refresh off the voting path.
  results-consumer:
    build: .
    container_name: election_results_consumer
    restart: unless-stopped
    command: ["python", "-m", "workers.results_consumer"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REFRESH_INTERVAL_SECONDS: ${REFRESH_INTERVAL_SECONDS:-5}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: election_prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - election_promdata:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.5.1
    container_name: election_grafana
    restart: unless-stopped
    environment:
      # Local development only: the dashboard is read-only infrastructure, so
      # anonymous viewing avoids a login prompt for something with no secrets.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - election_grafanadata:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  election_pgdata:
  election_kafkadata:
  election_promdata:
  election_grafanadata:
