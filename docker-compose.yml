services:
  postgres:
    image: postgres:16-alpine
    container_name: election_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - election_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: election_app
    restart: unless-stopped
    environment:
      # Inside the compose network the database is reached by service name on
      # its internal port. The 5433 mapping above only applies to the host.
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      FLASK_ENV: ${FLASK_ENV}
    ports:
      - "3000:3000"
    volumes:
      # Read-only so the importer can read the dataset without it being baked
      # into the image.
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  election_pgdata:
