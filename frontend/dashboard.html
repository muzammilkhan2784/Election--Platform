<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard - American Dream Election</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./theme.js"></script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="min-h-screen bg-ink-50 flex flex-col">

    <!-- Shared Navbar -->
    <header id="app-navbar" class="bg-white/90 backdrop-blur border-b border-ink-200 sticky top-0 z-20"></header>

    <!-- Content -->
    <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8 flex-1 w-full">

      <!-- Role-specific quick-actions panel (filled by JS) -->
      <div id="role-panel" class="hidden mb-6"></div>

      <!-- Elections section -->
      <div class="mb-6 flex items-center justify-between gap-4">
        <div>
          <h2 class="text-[22px] font-bold text-ink-900">Your elections</h2>
          <p class="text-ink-500 mt-1 text-[14.5px]">Choose an election to vote in or review results.</p>
        </div>
        <a id="create-election-btn" href="./ballot-editor.html"
          class="hidden bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold px-5 py-2.5 rounded-lg transition-colors whitespace-nowrap shadow-card">
          + Create Election
        </a>
      </div>
      <div id="elections-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 items-stretch"></div>
    </main>

    <!-- Shared Footer -->
    <footer id="app-footer" class="border-t border-ink-200 bg-white mt-auto"></footer>

    <script src="./dashboard.js" type="module"></script>
  </body>
</html>
