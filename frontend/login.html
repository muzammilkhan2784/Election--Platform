<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>American Dream Election – Sign in</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./theme.js"></script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="auth-page">
      <div class="w-full max-w-[408px]">
        <div class="auth-card">
          <div class="auth-logo">
            <img src="./logo.jpeg" alt="American Dream Election" class="auth-logo-img" />
          </div>

          <h1 class="auth-title">Sign in</h1>
          <p class="auth-subtitle">Secure voting for professional societies</p>

          <form id="login-form" novalidate class="auth-form">
            <div class="form-group">
              <label for="email">Email</label>
              <input
                type="email"
                id="email"
                name="email"
                autocomplete="email"
                placeholder="you@example.com"
                required
              />
            </div>

            <div class="form-group">
              <label for="password">Password</label>
              <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                placeholder="••••••••"
                required
              />
            </div>

            <div class="form-row">
              <label class="checkbox">
                <input type="checkbox" id="rememberMe" />
                <span>Remember me</span>
              </label>
              <a href="./forgot-password.html" class="link-small">Forgot password?</a>
            </div>

            <button type="submit" class="btn-primary">Sign in</button>

            <p id="error-message" class="form-error" aria-live="polite"></p>
          </form>
        </div>

        <p class="mt-6 text-center text-[13px] text-ink-400">
          &copy; <span id="year"></span> American Dream Election System
        </p>
      </div>
    </main>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
    <script src="./login.js" type="module"></script>
  </body>
</html>
